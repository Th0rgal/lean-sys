name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lean-and-rust:
    name: Lean 4.35.0 + C-ABI + Rust Crate Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache elan & Lean build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'LeanSys.lean', 'LeanSys/**/*.lean', 'c/lean_sys_shim.c') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Install elan and Lean 4.35.0 toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'build.rs', 'src/**/*.rs', 'c/lean_sys_shim.c') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install & cache turbo-lean spec auditor
        uses: Th0rgal/turbo-lean@3fea4a72fcd6d55cfe172c6b5a2651ad6dea1ef6
        with:
          project-dir: "."
          command: cache-only

      - name: Run Lean 4 CI verification gates (build, self-test, bench, turbo-lean 55/55 spec audit, TCB & shim hygiene)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          sudo prlimit --pid=$$ --nofile=131072:131072 || true
          ulimit -n 131072 || ulimit -n "$(ulimit -Hn)"
          ./scripts/ci_verify.sh

      - name: Run Rust build, warnings check, and C-ABI integration tests
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cargo test -- --nocapture
